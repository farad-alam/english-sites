name: unpack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack english-sites.zip into the repo root
        run: |
          set -e
          test -f english-sites.zip
          unzip -q english-sites.zip -d /tmp/x
          cp -a /tmp/x/english-sites/. .
          rm english-sites.zip
          git config user.name "Farad Alam"
          git config user.email "farad-alam@users.noreply.github.com"
          git add -A
          cat > /tmp/msg <<'MSG'
          Initial commit: English Sites (Next.js + Sanity + Cloudflare)

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01GfNDzc8qar4NCYHp7yZaWX
          MSG
          git commit -F /tmp/msg
          git push
