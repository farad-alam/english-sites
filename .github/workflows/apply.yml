name: apply
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch.zip to the repo root
        run: |
          set -e
          test -f patch.zip
          unzip -qo patch.zip -d /tmp/p
          cp -a /tmp/p/. .
          rm patch.zip
          git config user.name "Farad Alam"
          git config user.email "farad-alam@users.noreply.github.com"
          git add -A
          cat > /tmp/msg <<'MSG'
          Add CF_CACHE=kv option: cache pages in Workers KV instead of R2

          R2 needs a payment method on the Cloudflare account; KV does not. The choice is a
          build-time constant written by scripts/generate-wrangler.ts into open-next.cache.ts.

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01GfNDzc8qar4NCYHp7yZaWX
          MSG
          git commit -F /tmp/msg
          git push
